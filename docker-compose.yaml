services:
  db:
    image: mariadb:11.4
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - ./env/db.env
  
  api:
    build: 
      context: .
    depends_on:
      - db
    ports:
      - 80:8080
    environment:
      ASPNETCORE_URLS: http://+:8080
    
volumes:
  db_data: {}
